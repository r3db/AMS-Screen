<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bambu AMS Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
</head>
<body>
	<!-- Shared gradients used by the unit drawings (built in script.js) -->
	<svg width="0" height="0" style="position:absolute" aria-hidden="true">
		<defs>
			<linearGradient id="SpoolHole" x1="0" x2="1" y1="0.5" y2="0.5">
				<stop offset="0%" stop-color="#333" />
				<stop offset="100%" stop-color="#666" />
			</linearGradient>
			<linearGradient id="UnitFade" x1="0" x2="1">
				<stop offset="0" stop-color="#000" stop-opacity="0" />
				<stop offset="1" stop-color="#000" stop-opacity=".95" />
			</linearGradient>
		</defs>
	</svg>

	<div class="container">
		<!-- One page per device (AMS, AMS HT, external spool). Swipe or drag to switch. -->
		<div class="item units" tabindex="0" aria-label="Devices, swipe to switch"></div>
		<div class="item message">Connecting...</div>
	</div>

	<script src="script.js"></script>
</body>
</html>
