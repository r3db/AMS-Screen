<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bambu AMS Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
</head>
<body>
	<div class="container">
		<div class="item units">
			<svg width="100%" height="100%" viewBox="0 0 400 350" xmlns="http://www.w3.org/2000/svg" style="background-color:#141311">
				<defs>
					<linearGradient id="SpoolHole" x1="0" x2="1" y1="0.5" y2="0.5">
						<stop offset="0%" stop-color="#333" />
						<stop offset="100%" stop-color="#666" />
					</linearGradient>
					<linearGradient id="Unit" x1="0" x2="1" y1="0.5" y2="0.5">
						<stop offset="0%" stop-color="#333" stop-opacity="0.5" />
						<stop offset="68%" stop-color="#333" stop-opacity="0.5" />
						<stop offset="75%" stop-color="#333" stop-opacity=".8" />
						<stop offset="100%" stop-color="black" stop-opacity="1.0" />
					</linearGradient>
				</defs>
				<g transform="translate(10, 0)">
					<!-- Trays -->
					<g transform="translate(0, 100)">
						<!-- Tray 0 -->
						<g id="spool-0" transform="translate(0, 0)">
							<ellipse cx="40" cy="100" rx="30" ry="85" fill="#2a1e17" />
							<g>
								<line x1="65" x2="65" y1="30" y2="-40" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" />
								<text class="spool-type" x="65" y="-70" font-family="Cascadia Code" font-size="22" fill="#fff" text-anchor="middle">?</text>
								<text class="spool-weight" x="65" y="-50" font-family="Cascadia Code" font-size="14" fill="#fff" text-anchor="middle">-</text>
								<line id="spool-connector-0" x1="65" x2="65" y1="160" y2="300" stroke="#fff" stroke-width="1" style="display:none" />
							</g>
							<g class="spool-color">
								<rect x="42" y="30" width="60" height="140" />
								<ellipse cx="42" cy="100" rx="20" ry="70" />
							</g>
							<ellipse cx="100" cy="100" rx="30" ry="85" fill="#3c3c3c" />
							<ellipse cx="100" cy="100" rx="8" ry="20" fill="url(#Unit)" />
						</g>
						<!-- Tray 1 -->
						<g id="spool-1" transform="translate(78, 0)">
							<ellipse cx="40" cy="100" rx="30" ry="85" fill="#2a1e17" />
							<g>
								<line x1="65" x2="65" y1="30" y2="-40" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" />
								<text class="spool-type" x="65" y="-70" font-family="Cascadia Code" font-size="22" fill="#fff" text-anchor="middle">?</text>
								<text class="spool-weight" x="65" y="-50" font-family="Cascadia Code" font-size="14" fill="#fff" text-anchor="middle">-</text>
								<line id="spool-connector-1" x1="65" x2="65" y1="160" y2="300" stroke="#fff" stroke-width="1" style="display:none"/>
							</g>
							<g class="spool-color">
								<rect x="42" y="30" width="60" height="140" />
								<ellipse cx="42" cy="100" rx="20" ry="70" />
							</g>
							<ellipse cx="100" cy="100" rx="30" ry="85" fill="#3c3c3c" />
							<ellipse cx="100" cy="100" rx="8" ry="20" fill="url(#SpoolHole)" />
						</g>
						<!-- Tray 2 -->
						<g id="spool-2" transform="translate(156, 0)">
							<ellipse cx="40" cy="100" rx="30" ry="85" fill="#2a1e17" />
							<g>
								<line x1="65" x2="65" y1="30" y2="-40" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" />
								<text class="spool-type" x="65" y="-70" font-family="Cascadia Code" font-size="22" fill="#fff" text-anchor="middle">?</text>
								<text class="spool-weight" x="65" y="-50" font-family="Cascadia Code" font-size="14" fill="#fff" text-anchor="middle">-</text>
								<line id="spool-connector-2" x1="65" x2="65" y1="160" y2="300" stroke="#fff" stroke-width="1" style="display:none"/>
							</g>
							<g class="spool-color">
								<rect x="42" y="30" width="60" height="140" />
								<ellipse cx="42" cy="100" rx="20" ry="70" />
							</g>
							<ellipse cx="100" cy="100" rx="30" ry="85" fill="#3c3c3c" />
							<ellipse cx="100" cy="100" rx="8" ry="20" fill="url(#SpoolHole)" />
						</g>
						<!-- Tray 3 -->
						<g id="spool-3" transform="translate(234, 0)">
							<ellipse cx="40" cy="100" rx="30" ry="85" fill="#2a1e17" />
							<g>
								<line x1="65" x2="65" y1="30" y2="-40" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" />
								<text class="spool-type" x="65" y="-70" font-family="Cascadia Code" font-size="22" fill="#fff" text-anchor="middle">?</text>
								<text class="spool-weight" x="65" y="-50" font-family="Cascadia Code" font-size="14" fill="#fff" text-anchor="middle">-</text>
								<line id="spool-connector-3" x1="65" x2="65" y1="160" y2="300" stroke="#fff" stroke-width="1" style="display:none"/>
							</g>
							<g class="spool-color">
								<rect x="42" y="30" width="60" height="140" />
								<ellipse cx="42" cy="100" rx="20" ry="70" />
							</g>
							<ellipse cx="100" cy="100" rx="30" ry="85" fill="#3c3c3c" />
							<ellipse cx="100" cy="100" rx="8" ry="20" fill="url(#SpoolHole)" />
						</g>
					</g>
					<!-- Unit Case -->
					<g>
						<rect x="0" y="200" width="380" height="100" stroke-width="1px" stroke="#666" fill="url(#Unit)" />
						<path d="M 5 200 A 50 110 0 0 1 40 100"
						  fill="none"
						  stroke="#666"
						  stroke-width="1" />
						<path d="M 290 200 A 40 94 0 0 1 375 199.7 Z"
						  fill="none"
						  stroke="#666"
						  stroke-width="1" />
						<line x1="40" x2="334" y1="100" y2="100" stroke="#666" stroke-width="1" />
					</g>
					<!-- Temperature and Humidity -->
					<g>
						<text id="temperature" x="400" y="35" font-family="Cascadia Code" font-size="28" fill="#fff" text-anchor="left"></text>
						<text id="humidity"    x="400" y="65" font-family="Cascadia Code" font-size="28" fill="#fff" text-anchor="left"></text>
					</g>
				</g>
			</svg>
		</div>
		<div class="item message">Connecting...</div>
	</div>
	
	<script src="script.js"></script>
</body>
</html>
